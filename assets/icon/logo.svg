<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Deep near-black background rounded square (Android adaptive icon safe zone) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#141822"/>
      <stop offset="1"   stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#F43F5E"/>
      <stop offset="1"   stop-color="#B91C1C"/>
    </linearGradient>
    <!-- Subtle inner glow around shield edge for premium feel -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.7" stop-color="#E11D48" stop-opacity="0"/>
      <stop offset="1"   stop-color="#E11D48" stop-opacity="0.25"/>
    </radialGradient>
  </defs>

  <!-- Rounded-square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Faint diagonal accent for depth -->
  <path d="M 0,0 L 1024,0 L 1024,120 Q 512,220 0,120 Z"
        fill="#ffffff" opacity="0.03"/>

  <!-- ────────────────────────────────────────────────────────────────
       PhantomTrace mark: a stylized ghost that also reads as a shield.
       Rounded dome top (protective shield), two rounded tail bumps
       at the bottom (ghost tail). Inside: a radar target for one eye.
       ─────────────────────────────────────────────────────────────── -->
  <g transform="translate(512 528)">
    <!-- Soft red halo behind the mark -->
    <circle cx="0" cy="0" r="330" fill="url(#glow)"/>

    <!-- The ghost/shield silhouette -->
    <path fill="url(#shield)"
          d="M -220,-40
             Q -220,-260  0,-260
             Q 220,-260  220,-40
             L 220,220
             Q 175,255  135,215
             Q 95,175  55,215
             Q 15,255  -25,215
             Q -65,175 -105,215
             Q -145,255 -185,215
             Q -220,180 -220,140
             Z"/>

    <!-- Radar / eye: a target inside the ghost -->
    <!-- Outer ring -->
    <circle cx="0" cy="-95" r="70" fill="none" stroke="#FFFFFF" stroke-width="10"/>
    <!-- Crosshair lines -->
    <line x1="-95" y1="-95" x2="-40" y2="-95" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <line x1="40"  y1="-95" x2="95"  y2="-95" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <line x1="0"   y1="-190" x2="0" y2="-135" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <line x1="0"   y1="-55"  x2="0" y2="0"    stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <!-- Center pulse dot -->
    <circle cx="0" cy="-95" r="14" fill="#FFFFFF"/>

    <!-- Tiny arc mark, evokes tracking / motion -->
    <path d="M -155,80 A 155,155 0 0 0 155,80"
          fill="none" stroke="#FFFFFF" stroke-width="6"
          stroke-linecap="round" opacity="0.85"/>
    <path d="M -110,130 A 110,110 0 0 0 110,130"
          fill="none" stroke="#FFFFFF" stroke-width="6"
          stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
